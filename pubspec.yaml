name: lokus
description: A production-quality local AI model chat app.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Network / Downloads
  dio: ^5.4.3

  # File & Storage
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Local LLM Inference ──────────────────────────────────
  # llama.cpp for Android: real-time token streaming, chat templates,
  # Vulkan GPU acceleration. Built on llama.cpp b8201 (March 2026).
  # Requires Android API 26+, NDK r27+.
  flutter_llama: ^1.1.2

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.6.22
  markdown: ^7.2.2
  badges: ^3.1.2
  intl: ^0.19.0

  # Utils
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

dependency_overrides:
  flutter_llama:
    path: third_party/flutter_llama

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
